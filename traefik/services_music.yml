# ==============================================================================
# MUSIC MODULE - TRAEFIK SERVICES
# ==============================================================================
# Description: Traefik dynamic service definitions for the music module
# Author: Matt Barham
# Created: 2026-02-13
# Modified: 2026-04-21
# Version: 1.0.1
# Host: Your Server
# ==============================================================================
# Type: Traefik Dynamic Config (services)
# Component: module: music
# ==============================================================================

http:
  services:
    navidrome-svc:
      loadBalancer:
        servers:
          - url: http://navidrome:4533

    picard-svc:
      loadBalancer:
        servers:
          - url: http://picard:5800
        responseForwarding:
          flushInterval: 100ms
        healthCheck:
          path: /
          interval: 30s
          timeout: 5s
